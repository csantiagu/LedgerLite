name = "ledgerlite-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# No public address: the site (a Pages project, see frontend/wrangler.toml) forwards /api/* and
# /auth/* to this Worker through a service binding, so the browser sees a single origin (the
# SameSite=Strict refresh cookie needs that) and the API can't be reached any other way.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "accounts-db"
database_id = "f1733148-2d16-49e4-9707-8b9cd102139b"

[[r2_buckets]]
binding = "R2"
bucket_name = "accounts-storage"

# Workers Rate Limiting API: counters live in Cloudflare, no storage writes per request.
# namespace_id is any integer you choose, unique within your Cloudflare account.
# period must be 10 or 60 seconds.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REFRESH_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 200, period = 60 }

[vars]
ENVIRONMENT = "production"

# Secrets — set via CLI, never in this file (the API refuses to start if they're too short):
# wrangler secret put JWT_SECRET       (generate: openssl rand -base64 32)
# wrangler secret put API_KEY_SALT     (generate: openssl rand -base64 32)
# wrangler secret put ENCRYPTION_KEY   (generate: openssl rand -base64 32; encrypts 2FA secrets)
# wrangler secret put SETUP_TOKEN      (generate: openssl rand -base64 24; needed once, at /setup)
# wrangler secret put ALLOWED_ORIGIN   (the site's URL, e.g. https://ledgerlite-books.pages.dev;
#                                       a secret only so the address isn't published with the code)
