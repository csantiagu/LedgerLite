name = "ledgerlite"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# The frontend's static export is served by this same Worker, so the app and the API share one
# origin (the SameSite=Strict refresh cookie needs that). Build it first: npm run deploy does.
# API paths always reach the Worker code; everything else is a static file.
[assets]
directory = "../frontend/out"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "accounts-db"
database_id = "local-placeholder-replace-before-deploy"

[[r2_buckets]]
binding = "R2"
bucket_name = "accounts-storage"

# Workers Rate Limiting API: counters live in Cloudflare, no storage writes per request.
# namespace_id is any integer you choose, unique within your Cloudflare account.
# period must be 10 or 60 seconds.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "REFRESH_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 200, period = 60 }

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://app.yourdomain.com"

# Secrets — set via CLI, never in this file (the API refuses to start if they're too short):
# wrangler secret put JWT_SECRET       (generate: openssl rand -base64 32)
# wrangler secret put API_KEY_SALT     (generate: openssl rand -base64 32)
# wrangler secret put ENCRYPTION_KEY   (generate: openssl rand -base64 32; encrypts 2FA secrets)
# wrangler secret put SETUP_TOKEN      (generate: openssl rand -base64 24; needed once, at /setup)
